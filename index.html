<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Home Management App</title>
<style>
:root{
  --bg:#FAF4E8; --bg2:#F5EDDC;
  --card:#FFFFFF; --ink:#3E372E; --ink2:#6E6252; --muted:#9A8B74;
  --teal:#2F9E8F; --teal-dark:#1E7A6C; --teal-soft:#E2F3EF;
  --coral:#F0805F; --coral-dark:#D9623F; --coral-soft:#FDEAE2;
  --sun:#F6C453; --sun-soft:#FCF0D2;
  --line:#EFE5D0; --line2:#E7DCC2;
  --radius:18px;
  --shadow:0 2px 10px rgba(120,95,50,.07), 0 1px 3px rgba(120,95,50,.05);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-size:16px; line-height:1.45;
}
button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
button{font:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:var(--ink)}
h1,h2,h3{margin:0; line-height:1.2}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}

/* ---------- layout ---------- */
.app{display:flex; min-height:100vh}
.sidebar{
  width:248px; flex:0 0 248px; position:sticky; top:0; height:100vh; overflow-y:auto;
  background:linear-gradient(180deg,#FFFDF8, #FBF3E2);
  border-right:1px solid var(--line); padding:18px 14px 20px;
  display:flex; flex-direction:column; gap:14px;
}
.brand{display:flex; align-items:center; gap:10px; padding:2px 6px}
.brand .bname{font-weight:800; font-size:1.06rem; letter-spacing:.2px}
.brand .bsub{font-size:.78rem; color:var(--muted)}
.nav{display:flex; flex-direction:column; gap:4px}
.nav button{
  display:flex; align-items:center; gap:10px; text-align:left;
  background:transparent; border:1px solid transparent; border-radius:12px;
  padding:9px 12px; font-weight:600; color:var(--ink2); min-height:2.75rem;
}
.nav button .ni{font-size:1.15rem; width:26px; text-align:center}
.nav button:hover{background:#fff; border-color:var(--line)}
.nav button.active{background:var(--teal-soft); color:var(--teal-dark); border-color:#CBE8E1}
.side-data{margin-top:auto; border-top:1px dashed var(--line2); padding-top:12px; display:flex; flex-direction:column; gap:6px}
.side-data .sd-title{font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:0 6px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  background:#fff; border:1px solid var(--line2); color:var(--ink);
  border-radius:12px; padding:8px 14px; font-weight:600; min-height:2.5rem;
}
.btn:hover{border-color:var(--teal); color:var(--teal-dark)}
.btn.primary{background:var(--teal); border-color:var(--teal); color:#fff}
.btn.primary:hover{background:var(--teal-dark); color:#fff}
.btn.coral{background:var(--coral); border-color:var(--coral); color:#fff}
.btn.coral:hover{background:var(--coral-dark); color:#fff}
.btn.small{min-height:2.25rem; padding:5px 11px; font-size:.9rem; border-radius:10px}
.btn.ghost{border-color:transparent; background:transparent}
.btn.danger:hover{border-color:var(--coral); color:var(--coral-dark)}
.main{flex:1; min-width:0; padding:22px 26px 60px}
.wrap{max-width:1060px; margin:0 auto}

/* ---------- header / greeting ---------- */
.tophead{display:flex; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.greet{flex:1; min-width:240px}
.greet .hello{font-size:1.7rem; font-weight:800; letter-spacing:.2px}
.greet .hello .wave{display:inline-block}
.greet .today-line{color:var(--ink2); margin-top:3px}
.greet .tip{margin-top:8px; display:inline-block; background:var(--sun-soft); border:1px solid #F0DFA8; color:#7A5E14; border-radius:999px; padding:4px 12px; font-size:.86rem; font-weight:600}
.mascot{flex:0 0 auto}

/* ---------- cards & grids ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px}
.card + .card{margin-top:16px}
.card-head{display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap}
.card-head h3{flex:1}
.card-head .hint{font-size:.85rem; color:var(--muted); flex-basis:100%}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
.grid2 > .card + .card, .grid3 > .card + .card{margin-top:0}
.stack{display:flex; flex-direction:column; gap:16px}
.stack > .card + .card{margin-top:0}

/* ---------- view header ---------- */
.viewhead{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.viewhead h2{flex:1; display:flex; align-items:center; gap:10px}
.viewhead .vsub{flex-basis:100%; color:var(--ink2); font-size:.95rem}

/* ---------- subtabs ---------- */
.subtabs{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px}
.subtabs button{
  border:1px solid var(--line2); background:#fff; border-radius:999px;
  padding:7px 15px; font-weight:600; color:var(--ink2); min-height:2.5rem;
}
.subtabs button.active{background:var(--coral-soft); border-color:#F6C4B2; color:var(--coral-dark)}

/* ---------- checklists ---------- */
.chk{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:12px; min-height:2.75rem}
.chk:hover{background:#FBF7EC}
.chk input[type="checkbox"]{width:22px; height:22px; accent-color:var(--teal); flex:0 0 auto; cursor:pointer}
.chk .ctext{flex:1; min-width:0}
.chk input[type="checkbox"]:checked ~ .ctext{color:var(--muted); text-decoration:line-through}
.chk .who{font-size:.78rem; font-weight:700; background:var(--teal-soft); color:var(--teal-dark); border-radius:999px; padding:2px 9px; white-space:nowrap}
.xbtn{
  flex:0 0 auto; width:36px; height:36px; border-radius:10px; border:1px solid transparent;
  background:transparent; color:var(--muted); font-size:1.15rem; line-height:1;
}
.xbtn:hover{color:var(--coral-dark); border-color:#F6C4B2; background:var(--coral-soft)}
.addrow{display:flex; gap:8px; margin-top:10px}
.addrow input{flex:1; min-width:0}
.field, .addrow input, .cellinput, textarea.field{
  border:1px solid var(--line2); border-radius:10px; background:#FFFDF8; padding:8px 11px; width:100%;
}
.field:focus, .addrow input:focus, .cellinput:focus, textarea.field:focus{outline:2px solid #BFE3DB; border-color:var(--teal)}
textarea.field{resize:vertical; min-height:64px}
.cellinput{padding:6px 9px; min-height:2.25rem}
.num{width:96px}
.progress{height:12px; background:var(--bg2); border-radius:999px; overflow:hidden; margin-top:8px}
.progress > div{height:100%; background:linear-gradient(90deg,var(--teal),#57BFA9); border-radius:999px; transition:width .3s}
.progress.coralbar > div{background:linear-gradient(90deg,var(--coral),#F6A183)}
.mini{font-size:.85rem; color:var(--muted)}
.tag{display:inline-block; font-size:.78rem; font-weight:700; border-radius:999px; padding:2px 10px; background:var(--sun-soft); color:#7A5E14}
.tag.teal{background:var(--teal-soft); color:var(--teal-dark)}
.tag.coral{background:var(--coral-soft); color:var(--coral-dark)}

/* rows of bound inputs */
.irow{display:flex; gap:8px; align-items:center; padding:7px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap}
.irow:last-child{border-bottom:none}
.irow .grow{flex:1; min-width:120px}
.irow label.fl{font-size:.8rem; color:var(--muted); display:flex; flex-direction:column; gap:2px}
.irow .diff{font-weight:700; min-width:76px; text-align:right}
.diff.pos{color:var(--teal-dark)} .diff.neg{color:var(--coral-dark)}

/* day cards (meal plan / cleaning schedule) */
.daygrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(264px,1fr)); gap:14px}
.daycard{background:#FFFDF8; border:1px solid var(--line); border-radius:14px; padding:13px 14px}
.daycard.today{border-color:var(--teal); box-shadow:0 0 0 2px #CBE8E1}
.daycard h4{margin:0 0 8px; font-size:.98rem; display:flex; align-items:center; gap:8px}
.daycard h4 .tag{margin-left:auto}
.slot{display:flex; align-items:flex-start; gap:8px; margin-top:6px}
.slot .sl{flex:0 0 74px; font-size:.8rem; font-weight:700; color:var(--muted); padding-top:8px}
.slot input{flex:1; min-width:0}
.slot textarea{flex:1; min-width:0}
.mealfield{resize:none; overflow:hidden; line-height:1.35; white-space:pre-wrap; overflow-wrap:break-word}
.irow .rowmain{display:flex; align-items:center; gap:8px; flex:1 1 180px; min-width:0}
.irow .rowmain .grow{flex:1; min-width:0}
.daycard .chk{padding:5px 4px; min-height:2.4rem}

/* challenge grid */
.chal{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px}
.chal button{
  text-align:left; border:1px solid var(--line2); background:#FFFDF8; border-radius:13px;
  padding:10px 12px; min-height:4.4rem; display:flex; flex-direction:column; gap:3px;
}
.chal button .dnum{font-size:.75rem; font-weight:800; letter-spacing:.05em; color:var(--muted)}
.chal button.done{background:var(--teal-soft); border-color:#BFE3DB}
.chal button.done .ctask{color:var(--teal-dark); text-decoration:line-through}
.chal button .ctask{font-weight:600; font-size:.92rem}

/* habit tracker */
.habit{border-bottom:1px dashed var(--line); padding:10px 0}
.habit:last-child{border-bottom:none}
.habit .hname{display:flex; align-items:center; gap:8px; margin-bottom:7px}
.habit .hname input{flex:1; min-width:0; font-weight:600}
.dow{display:flex; gap:6px; flex-wrap:wrap}
.dow button{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--line2); background:#FFFDF8;
  font-weight:700; font-size:.8rem; color:var(--ink2); padding:0;
}
.dow button.on{background:var(--teal); border-color:var(--teal); color:#fff}
.dow button small{display:block; font-size:.6rem; font-weight:600; opacity:.85}

/* mood picker */
.moods{display:flex; gap:8px; flex-wrap:wrap}
.moods button{
  width:52px; height:52px; border-radius:16px; border:2px solid var(--line2); background:#FFFDF8;
  font-size:1.55rem; padding:0; line-height:1;
}
.moods button.on{border-color:var(--coral); background:var(--coral-soft)}
.stars{font-size:1.3rem; letter-spacing:2px; color:var(--sun)}
.stars .off{color:#E4D9BE}

/* today hero bits */
.top3 .chk{font-size:1.03rem; font-weight:600}
.kv{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}
.kv b{text-align:right}
.empty{color:var(--muted); font-size:.92rem; padding:6px 2px}
.note-area{width:100%}

/* zone list */
.zone{border:1px solid var(--line); border-radius:14px; padding:13px 14px; background:#FFFDF8}
.zone h4{margin:0 0 4px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.zone.active{border-color:var(--coral); box-shadow:0 0 0 2px #FADFD2}

/* print view */
#printView{display:none}
body.printing .app{display:none}
body.printing #printView{display:block}
#printView .pv-bar{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  background:#fff; border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin:16px auto; max-width:820px;
}
.sheet{
  background:#fff; color:#222; max-width:820px; margin:0 auto 30px; padding:38px 42px;
  border:1px solid #ddd; font-family:Georgia, "Times New Roman", serif;
}
.sheet h1{font-size:1.55rem; margin:0 0 2px}
.sheet .s-sub{color:#666; font-family:"Segoe UI", system-ui, sans-serif; font-size:.86rem; margin-bottom:16px}
.sheet h2{font-size:1.05rem; margin:20px 0 8px; border-bottom:2px solid #2F9E8F; padding-bottom:4px}
.sheet table{width:100%; border-collapse:collapse; font-family:"Segoe UI", system-ui, sans-serif; font-size:.88rem}
.sheet th,.sheet td{border:1px solid #CFC8B8; padding:6px 8px; text-align:left; vertical-align:top}
.sheet th{background:#F3EEE1}
.sheet .tot td{font-weight:700; background:#F8F4E8}
.sheet ul{margin:4px 0 4px 18px; padding:0; font-family:"Segoe UI", system-ui, sans-serif; font-size:.9rem}
.sheet .foot{margin-top:22px; color:#888; font-size:.78rem; font-family:"Segoe UI", system-ui, sans-serif}
@page{margin:14mm}
@media print{
  body{background:#fff}
  body.printing #printView .pv-bar{display:none}
  .sheet{border:none; margin:0; max-width:none; padding:0}
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#FFF7E8; padding:11px 18px; border-radius:999px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:92vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .grid2,.grid3{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{flex-direction:column}
  .sidebar{
    width:100%; flex:none; position:sticky; top:0; z-index:40; height:auto; overflow:visible;
    padding:12px 12px 10px; border-right:none; border-bottom:1px solid var(--line);
  }
  .brand .bsub{display:none}
  .nav{flex-direction:row; flex-wrap:wrap; gap:6px}
  .nav button{padding:7px 10px; min-height:2.5rem; font-size:.92rem; border:1px solid var(--line); background:#fff}
  .nav button .ni{width:auto}
  .side-data{flex-direction:row; flex-wrap:wrap; align-items:center}
  .side-data .sd-title{flex-basis:100%}
  .main{padding:16px 14px 50px}
  .greet .hello{font-size:1.4rem}
  .mascot{display:none}
  .sheet{padding:22px 18px}
  .num{width:82px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>

<script>
"use strict";
/* ============================== utilities ============================== */
var $ = function(s, r){ return (r||document).querySelector(s); };
var DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var DAYS3 = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var _uid = 100;
function nid(){ _uid++; return "i" + Date.now().toString(36) + _uid; }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function getP(o, p){
  var ks = p.split("."), a = o, i;
  for (i = 0; i < ks.length; i++){ if (a == null) return undefined; a = a[ks[i]]; }
  return a;
}
function setP(o, p, v){
  var ks = p.split("."), a = o, i;
  for (i = 0; i < ks.length - 1; i++){ a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}
function money(n){
  var v = parseFloat(n) || 0;
  return "$" + v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
}
function todayKey(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dayIndex(){ /* Monday = 0 */
  var d = new Date().getDay(); return (d + 6) % 7;
}
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("show"); }, 2400);
}
</script>

/* ============================== state ============================== */
var LS_KEY = "pixelora-home-management-v1";
var LS_BACKUP_KEY = LS_KEY + "-backup";
var state = null;
var lastStoredJSON = null; /* the exact string this tab last wrote or adopted — spots a newer save made in another tab */
function save(){
  try {
    var json = JSON.stringify(state);
    localStorage.setItem(LS_KEY, json);
    try { localStorage.setItem(LS_BACKUP_KEY, json); } catch(e2){}
    lastStoredJSON = json;
  } catch(e){}
}
function fillMissingSections(o){
  /* Repair, never replace: every section already saved — above all Today's Top 3 — is kept
     exactly as the user left it. Only a section that is missing entirely is filled from the demo. */
  var d = demoData(), k;
  for (k in d){ if (o[k] === undefined || o[k] === null) o[k] = d[k]; }
  if (!o.today || typeof o.today !== "object") o.today = d.today;
  if (!Array.isArray(o.today.top3)) o.today.top3 = d.today.top3;
  if (!Array.isArray(o.today.extra)) o.today.extra = d.today.extra;
  return o;
}
function load(){
  var raw = null, backupRaw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){}
  try { backupRaw = localStorage.getItem(LS_BACKUP_KEY); } catch(e){}
  if (raw){
    try {
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === "object"){
        state = fillMissingSections(parsed);
        lastStoredJSON = raw;
        try { localStorage.setItem(LS_BACKUP_KEY, raw); } catch(e){}
        return;
      }
    } catch(e){}
    /* A saved planner is there but unreadable: keep a copy of it and fall back to the rolling
       backup — the demo seed must never overwrite the user's own data. */
    try { localStorage.setItem(LS_KEY + "-unreadable", raw); } catch(e){}
    if (backupRaw){
      try {
        var bp = JSON.parse(backupRaw);
        if (bp && typeof bp === "object"){ state = fillMissingSections(bp); save(); return; }
      } catch(e){}
    }
  }
  /* Nothing stored at all — a genuine first run, so seed the demo. */
  state = demoData(); save();
}
load();

  else if (hr < 17){ word = "Good afternoon"; emoji = "🌤️"; tip = "Halfway there. A 10-minute tidy now saves the evening."; }
  else if (hr < 21){ word = "Good evening"; emoji = "🌆"; tip = "Dinner, a quick reset, and the day is basically done."; }
  else { word = "Good night"; emoji = "🌙"; tip = "Set out tomorrow's Top 3, then switch off."; }
  var dateStr = now.toLocaleDateString("en-GB", {weekday: "long", day: "numeric", month: "long", year: "numeric"});
  return '<div class="tophead"><div class="greet"><div class="hello">' + word + ", " + esc(state.familyName || "friend") + ' <span class="wave" aria-hidden="true">' + emoji + '</span></div>' +
    '<p class="today-line">' + esc(dateStr) + ' · Here is your home at a glance.</p>' +
    '<span class="tip">💡 ' + esc(tip) + "</span></div>" + mascotSVG() + "</div>";
}

<script>

    '<button type="button" class="btn primary" data-printnow>🖨 Print / Save as PDF</button>' +
    '<span class="mini">Your print dialogue should already be open — if it isn\'t, tap <b>Print / Save as PDF</b>. Choose <b>US Letter</b> or <b>A4</b> — this sheet is the only thing that prints, and it shows your plan exactly as you\'ve filled it in.</span></div>' +
    '<div class="sheet"><h1>' + esc(title) + '</h1><p class="s-sub">' + esc(sub) + '</p>' + bodyHTML +
    '<p class="foot">From our family\'s Home Management App · Printed ' + new Date().toLocaleDateString("en-GB", {day: "numeric", month: "long", year: "numeric"}) + "</p></div>";
}
function taskListPrint(items){
  var open = items.filter(function(t){ return t.text; });
  if (!open.length) return '<span style="color:#999">—</span>';
  return "<ul>" + open.map(function(t){ return "<li>" + (t.done ? "☑ " : "☐ ") + esc(t.text) + "</li>"; }).join("") + "</ul>";
}
function printSheet(kind){
  var body = "";
  if (kind === "cleaning"){
    body = "<h2>This week's focus</h2><p>" + esc(state.cleaning.weeklyFocus || "—") + "</p>" +
      "<h2>Weekly schedule</h2><table><tr><th style='width:16%'>Day</th><th>Tasks</th></tr>" +
      DAYS.map(function(d){ return "<tr><td><b>" + d + "</b></td><td>" + taskListPrint(state.cleaning.weeklyPlan[d]) + "</td></tr>"; }).join("") + "</table>" +
      "<h2>Daily basics</h2>" + taskListPrint(state.cleaning.daily);
    return sheetShell("Weekly Cleaning Schedule", "Our Home · tick each job off as it's done", body);
  }
  if (kind === "chores"){
    body = "<table><tr><th>Person</th>" + DAYS3.map(function(d){ return "<th>" + d + "</th>"; }).join("") + "</tr>" +
      state.people.map(function(p, pi){
        return "<tr><td><b>" + esc(p.name) + "</b></td>" + DAYS.map(function(d){ return "<td>" + esc((state.chores.chart[String(pi)] || {})[d] || "—") + "</td>"; }).join("") + "</tr>";
      }).join("") + "</table>" +
      "<h2>Standing responsibilities</h2><ul>" + state.chores.responsibilities.filter(function(r){ return r.task; }).map(function(r){ return "<li>" + (r.done ? "☑ " : "☐ ") + esc(r.task) + (r.who ? " — <b>" + esc(r.who) + "</b>" : "") + "</li>"; }).join("") + "</ul>";
    return sheetShell("Family Chore Chart", "Our Home · one job each, every day", body);
  }
  if (kind === "meals"){
    body = "<table><tr><th style='width:14%'>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr>" +
      DAYS.map(function(d){ var m = state.meals.plan[d]; return "<tr><td><b>" + d + "</b></td><td>" + esc(m.b || "—") + "</td><td>" + esc(m.l || "—") + "</td><td>" + esc(m.d || "—") + "</td></tr>"; }).join("") + "</table>" +
      "<h2>Grocery list</h2><ul>" + state.meals.grocery.filter(function(g){ return g.item; }).map(function(g){ return "<li>" + (g.done ? "☑ " : "☐ ") + esc(g.item) + (g.qty ? " — " + esc(g.qty) : "") + " <i>(" + esc(g.cat) + ")</i></li>"; }).join("") + "</ul>";
    return sheetShell("Weekly Meal Plan", "Our Home · what's cooking this week", body);
  }
  if (kind === "money"){
    var tb = 0, ts = 0;
    var rows = state.money.budget.map(function(r){
      tb += parseFloat(r.budgeted) || 0; ts += parseFloat(r.spent) || 0;
      var d = (parseFloat(r.budgeted) || 0) - (parseFloat(r.spent) || 0);
      return "<tr><td>" + esc(r.cat) + "</td><td>" + money(r.budgeted) + "</td><td>" + money(r.spent) + "</td><td>" + (d < 0 ? "−" + money(-d) : money(d)) + "</td></tr>";
    }).join("");
    body = "<table><tr><th>Category</th><th>Budgeted</th><th>Spent</th><th>Difference</th></tr>" + rows +
      "<tr class='tot'><td>Total</td><td>" + money(tb) + "</td><td>" + money(ts) + "</td><td>" + money(tb - ts) + "</td></tr></table>" +
      "<p style='margin-top:10px'>Monthly income: <b>" + money(state.money.income) + "</b> · Left after spending: <b>" + money((parseFloat(state.money.income) || 0) - ts) + "</b></p>" +
      "<h2>Bills</h2><table><tr><th>Bill</th><th>Amount</th><th>Due</th><th>Paid?</th></tr>" +
      state.money.bills.map(function(b){ return "<tr><td>" + esc(b.name) + "</td><td>" + money(b.amount) + "</td><td>" + esc(b.due) + "</td><td>" + (b.paid ? "Yes ✓" : "☐") + "</td></tr>"; }).join("") + "</table>" +
      "<h2>Savings</h2><ul>" + state.money.savings.map(function(g){ return "<li>" + esc(g.name) + " — " + money(g.saved) + " of " + money(g.goal) + "</li>"; }).join("") + "</ul>";
    return sheetShell("Budget Summary · " + (state.money.monthLabel || ""), "Our Home · planned vs. actual", body);
  }
  return "";
}

/* ============================== LEAVING THE PRINT SHEET ============================== */
/* The app view underneath never changed while the sheet was open (view + sub-tab are kept),
   so re-rendering returns to the exact section the user came from. */
function exitPrintView(){
  if (!document.body.classList.contains("printing")) return;
  document.body.classList.remove("printing");
  $("#printView").innerHTML = "";
  render();
  window.scrollTo({top: 0});
}
/* The Back button gets its own capture-phase listener: it runs before every other click
   handler, so nothing in the main delegation can swallow or outrun it. */
document.addEventListener("click", function(e){
  var b = e.target && e.target.closest ? e.target.closest("[data-back]") : null;
  if (b){ e.preventDefault(); e.stopPropagation(); exitPrintView(); }
}, true);
/* When the browser's print dialogue closes — printed or cancelled — come back to the app too,
   instead of leaving the sheet on screen. */
window.addEventListener("afterprint", exitPrintView);

/* ============================== RENDER / NAV ============================== */
var NAV = [
  ["today", "🏠", "Today"],
  ["cleaning", "🧹", "Cleaning"],
  ["chores", "🧒", "Family Chores"],
  ["declutter", "📦", "Declutter"],
  ["meals", "🍽️", "Meals"],
  ["money", "💰", "Money"],
  ["health", "🌿", "Health & Habits"],
  ["planning", "🗒️", "Planning"],
  ["records", "🗂️", "Records"]
];
var VIEWS = { today: vToday, cleaning: vCleaning, chores: vChores, declutter: vDeclutter, meals: vMeals, money: vMoney, health: vHealth, planning: vPlanning, records: vRecords };
function renderNav(){
  $("#mainNav").innerHTML = NAV.map(function(n){
    return '<button type="button" data-nav="' + n[0] + '"' + (view === n[0] ? ' class="active"' : "") + '><span class="ni" aria-hidden="true">' + n[1] + "</span>" + n[2] + "</button>";
  }).join("");
}
function autosizeAreas(root){
  (root || document).querySelectorAll("textarea[data-autosize]").forEach(function(ta){
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  });
}
function render(){
  renderNav();
  $("#viewRoot").innerHTML = VIEWS[view]();
  autosizeAreas($("#viewRoot"));
  window.scrollTo({top: 0});
}

/* ============================== EVENTS ============================== */
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-nav],[data-sub],[data-del],[data-add],[data-addtext],[data-addobj],[data-print],[data-printnow],[data-back],[data-mood],[data-chal],[data-habit],[data-star],[data-zone-next]");
  if (!t) return;
  if (t.hasAttribute("data-nav")){ view = t.getAttribute("data-nav"); render(); return; }
  if (t.hasAttribute("data-sub")){
    var sp = t.getAttribute("data-sub").split(":"); SUB[sp[0]] = sp[1]; render(); return;
  }
  if (t.hasAttribute("data-del")){
    var dp = t.getAttribute("data-del").split(":"), arr = getP(state, dp[0]);
    if (Array.isArray(arr)){ arr.splice(parseInt(dp[1], 10), 1); save(); render(); toast("Removed"); }
    return;
  }
  if (t.hasAttribute("data-add")){
    var ap = t.getAttribute("data-add"), aarr = getP(state, ap);
    if (Array.isArray(aarr) && FACTORIES[ap]){ aarr.push(FACTORIES[ap]()); save(); render(); }
    return;
  }
  if (t.hasAttribute("data-addobj")){
    if (t.getAttribute("data-addobj") === "laundry"){ state.cleaning.laundry.push({day: "", load: ""}); save(); render(); }
    return;
  }
  if (t.hasAttribute("data-addtext")){
    var tp = t.getAttribute("data-addtext");
    var inp = document.querySelector('[data-addinput="' + tp + '"]');
    var val = inp ? inp.value.trim() : "";
    var tarr = getP(state, tp);
    if (Array.isArray(tarr)){
      if (tp === "today.top3" && tarr.length >= 3){ toast("Your Top 3 is full — tick one off or remove one first."); return; }
      var item = FACTORIES[tp] ? FACTORIES[tp]() : T("");
      if (item && "text" in item) item.text = val;
      tarr.push(item); save(); render();
    }
    return;
  }
  if (t.hasAttribute("data-print")){
    $("#printView").innerHTML = printSheet(t.getAttribute("data-print"));
    document.body.classList.add("printing");
    window.scrollTo({top: 0});
    /* open the browser print dialogue straight away — the sheet reflects the current filled state */
    setTimeout(function(){ try { window.print(); } catch(e){} }, 80);
    return;
  }
  if (t.hasAttribute("data-printnow")){
    try { window.print(); } catch(e){}
    return;
  }
  if (t.hasAttribute("data-back")){ exitPrintView(); return; }
  if (t.hasAttribute("data-mood")){
    var ck = state.checkins[todayKey()] || {mood: "", energy: 3, note: ""};
    ck.mood = t.getAttribute("data-mood"); state.checkins[todayKey()] = ck; save(); render();
    return;
  }
  if (t.hasAttribute("data-chal")){
    var cp = t.getAttribute("data-chal").split(":");
    var arr2 = cp[0] === "cleaning" ? state.cleaning.challengeDone : state.declutter.challengeDone;
    var idx = parseInt(cp[1], 10);
    arr2[idx] = !arr2[idx]; save(); render();
    return;
  }
  if (t.hasAttribute("data-habit")){
    var hp = t.getAttribute("data-habit").split(":");
    var hb = state.health.habits[parseInt(hp[0], 10)];
    if (hb){ var di2 = parseInt(hp[1], 10); hb.days[di2] = !hb.days[di2]; save(); render(); }
    return;
  }
  if (t.hasAttribute("data-star")){
    var stp = t.getAttribute("data-star").split(":");
    var robj = getP(state, stp[0]);
    if (robj){ robj.stars = Math.max(0, (parseInt(robj.stars, 10) || 0) + parseInt(stp[1], 10)); save(); render(); }
    return;
  }
  if (t.hasAttribute("data-zone-next")){
    state.cleaning.zoneWeek = (state.cleaning.zoneWeek % 5) + 1; save(); render();
    return;
  }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.matches("[data-bind]")){
    var v = t.type === "number" ? (t.value === "" ? 0 : parseFloat(t.value)) : t.value;
    setP(state, t.getAttribute("data-bind"), v); save();
    if (view === "money" || t.getAttribute("data-bind").indexOf("declutter.goals") === 0 || t.getAttribute("data-bind").indexOf("declutter.makeover") === 0) render();
    return;
  }
  if (t.matches("[data-check]")){
    setP(state, t.getAttribute("data-check"), t.checked); save();
    if (view === "money" || view === "cleaning") render();
    return;
  }
  if (t.matches("[data-chore]")){
    var cp2 = t.getAttribute("data-chore").split("|");
    if (!state.chores.chart[cp2[0]]) state.chores.chart[cp2[0]] = {};
    state.chores.chart[cp2[0]][cp2[1]] = t.value; save();
    return;
  }
  if (t.matches("[data-range]")){
    var ck2 = state.checkins[todayKey()] || {mood: "", energy: 3, note: ""};
    ck2.energy = parseInt(t.value, 10); state.checkins[todayKey()] = ck2; save(); render();
    return;
  }
  if (t.matches("[data-checkin-note]")){
    var ck3 = state.checkins[todayKey()] || {mood: "", energy: 3, note: ""};
    ck3.note = t.value; state.checkins[todayKey()] = ck3; save();
    return;
  }
});
document.addEventListener("input", function(e){
  var t = e.target;
  if (t.matches && t.matches("textarea[data-autosize]")){
    t.style.height = "auto";
    t.style.height = t.scrollHeight + "px";
  }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Enter" && e.target.matches && e.target.matches("[data-addinput]")){
    e.preventDefault();
    var p = e.target.getAttribute("data-addinput");
    var btn = document.querySelector('[data-addtext="' + p + '"]');
    if (btn) btn.click();
  }
  if (e.key === "Escape" && document.body.classList.contains("printing")){
    exitPrintView();
  }
});

/* ============================== BACKUP / RESTORE ============================== */
$("#btnBackup").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "home-management-backup-" + todayKey() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  toast("Backup downloaded ✓");
});
$("#btnRestore").addEventListener("click", function(){ $("#fileRestore").click(); });
$("#fileRestore").addEventListener("change", function(){
  var f = this.files && this.files[0];
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var data = JSON.parse(reader.result);
      if (!data || !data.cleaning || !data.meals || !data.money || !data.records) throw new Error("bad file");
      state = fillMissingSections(data); save(); render(); toast("Backup restored ✓ Welcome back!");
    } catch(err){ toast("That file doesn't look like a Home Management backup."); }
  };
  reader.readAsText(f);
  this.value = "";
});
var demoArm = false, demoTimer = null;
$("#btnDemo").addEventListener("click", function(){
  if (!demoArm){
    demoArm = true; this.textContent = "⚠ Tap again to replace everything with demo data";
    toast("This replaces ALL current data with the demo. Tap again to confirm.");
    demoTimer = setTimeout(function(){ demoArm = false; $("#btnDemo").textContent = "↺ Restore demo data"; }, 5000);
    return;
  }
  clearTimeout(demoTimer); demoArm = false; this.textContent = "↺ Restore demo data";
  state = demoData(); save(); view = "today"; render();
  toast("Demo data restored — say hello to Sara's family 👋");
});

/* ============================== CROSS-TAB SYNC ============================== */
/* If another open tab saves newer data (say, a Top 3 edited there), adopt that saved state
   here. Without this, this tab keeps its older in-memory copy and its next save — for any
   section at all — silently writes the old Top 3 back over the newer one. Adopting never
   saves, so tabs can't bounce writes back and forth. */
function adoptStoredState(){
  var raw = null;
  try { raw = localStorage.getItem(LS_KEY); } catch(e){}
  if (!raw || raw === lastStoredJSON) return;
  var parsed = null;
  try { parsed = JSON.parse(raw); } catch(e){}
  if (!parsed || typeof parsed !== "object") return;
  state = fillMissingSections(parsed);
  lastStoredJSON = raw;
  var ae = document.activeElement;
  var typing = ae && (ae.tagName === "INPUT" || ae.tagName === "TEXTAREA" || ae.tagName === "SELECT");
  if (!typing && !document.body.classList.contains("printing")) render();
}
window.addEventListener("storage", function(e){
  if (e.key === LS_KEY || e.key === null) adoptStoredState();
});
document.addEventListener("visibilitychange", function(){ if (!document.hidden) adoptStoredState(); });
window.addEventListener("focus", adoptStoredState);

/* ============================== INIT ============================== */
render();
</script>
